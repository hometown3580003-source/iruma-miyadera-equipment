<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>備品管理板 | りらくる入間宮寺店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F0;
    --card:#FFFFFF;
    --ink:#22302A;
    --ink-soft:#5C6B62;
    --ink-faint:#93A199;
    --line:#DEE3D8;
    --sage:#4F6E58;
    --sage-deep:#33473A;
    --amber:#A9781F;
    --brick:#9C4B3D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 0 64px;}

  header{
    padding:26px 20px 18px;
    border-bottom:1px solid var(--line);
    background:var(--card);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }
  .eyebrow{font-size:12.5px;color:var(--sage);letter-spacing:.04em;margin:0 0 4px;}
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:24px;
    margin:0 0 6px;
    color:var(--sage-deep);
    letter-spacing:.02em;
  }
  .sub{font-size:13px;color:var(--ink-soft);margin:0;}
  .gear-btn{
    flex:none;
    width:38px;height:38px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    margin-top:2px;
  }
  .gear-btn svg{width:19px;height:19px;}

  .settings-panel{display:none;background:var(--card);border-bottom:1px solid var(--line);padding:16px 20px 20px;}
  .settings-panel.open{display:block;}
  .settings-title{font-size:13px;font-weight:600;color:var(--ink);margin:0 0 4px;}
  .settings-desc{font-size:11.5px;color:var(--ink-soft);margin:0 0 14px;}
  .settings-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
  .settings-row:first-of-type{border-top:none;}
  .settings-cat{flex:1;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .settings-cat .icon-mini{width:18px;height:18px;color:var(--ink-soft);flex:none;}
  .settings-fields{display:flex;gap:8px;flex:none;}
  .settings-field{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .settings-field label{font-size:9.5px;color:var(--ink-faint);}
  .settings-field input{
    width:54px;padding:6px 4px;text-align:center;border:1px solid var(--line);border-radius:6px;
    font-family:inherit;font-size:13px;color:var(--ink);
  }
  .settings-actions{display:flex;gap:8px;margin-top:16px;}
  .settings-actions .btn{padding:10px;}
  .btn-ghost{background:#fff;color:var(--ink-soft);border:1px solid var(--line);}
  .settings-msg{font-size:11.5px;margin-top:10px;color:var(--sage);}
  .settings-msg.err{color:var(--brick);}

  .tabbar{
    display:flex;gap:8px;padding:14px 16px;overflow-x:auto;
    background:var(--card);border-bottom:1px solid var(--line);
    -webkit-overflow-scrolling:touch;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tab{
    flex:none;display:flex;align-items:center;gap:6px;
    padding:8px 13px;border-radius:999px;border:1px solid var(--line);
    background:#fff;font-size:13px;color:var(--ink-soft);cursor:pointer;
    white-space:nowrap;-webkit-tap-highlight-color:transparent;
  }
  .tab .tdot{width:8px;height:8px;border-radius:50%;flex:none;}
  .tab.active{color:#fff;border-color:transparent;font-weight:600;}

  .overview{padding:14px 16px 6px;background:var(--card);border-bottom:1px solid var(--line);}
  .overview-title{font-size:11px;color:var(--ink-faint);margin-bottom:8px;letter-spacing:.03em;}
  .ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;}
  .ov-tile{border-radius:8px;padding:6px 2px;text-align:center;cursor:pointer;background:#EEF0EA;-webkit-tap-highlight-color:transparent;}
  .ov-tile.state-ok{background:#E9EFE7;}
  .ov-tile.state-soon{background:#F6ECD8;}
  .ov-tile.state-overdue{background:#F5E1DD;}
  .ov-icon{margin:0 auto 3px;}
  .ov-icon svg{width:18px;height:18px;display:block;color:var(--ink-soft);}
  .ov-label{font-size:9.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ov-days{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--sage);margin-top:2px;line-height:1;}
  .ov-tile.state-soon .ov-days{color:var(--amber);}
  .ov-tile.state-overdue .ov-days{color:var(--brick);}
  .ov-days.never{font-size:10px;color:var(--brick);}

  .summary{display:flex;gap:10px;padding:16px 20px 4px;}
  .sum-item{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .sum-num{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}
  .sum-label{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .sum-item.overdue .sum-num{color:var(--brick);}
  .sum-item.soon .sum-num{color:var(--amber);}
  .sum-item.ok .sum-num{color:var(--sage);}

  .list{padding:14px 14px 0;display:flex;flex-direction:column;gap:8px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .15s ease;}
  .card.state-overdue{border-color:rgba(156,75,61,.35);}
  .card.state-soon{border-color:rgba(169,120,31,.3);}

  .row{display:flex;align-items:center;gap:12px;padding:14px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .icon-badge{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:#EEF0EA;}
  .icon-badge svg{width:20px;height:20px;display:block;color:var(--ink-soft);}
  .card.state-ok .icon-badge{background:#E9EFE7;}
  .card.state-soon .icon-badge{background:#F6ECD8;}
  .card.state-overdue .icon-badge{background:#F5E1DD;}

  .row-main{flex:1;min-width:0;}
  .name{font-family:'Shippori Mincho', serif;font-weight:600;font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .last-info{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  .days-box{text-align:right;flex:none;}
  .days-num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--sage);}
  .state-soon .days-num{color:var(--amber);}
  .state-overdue .days-num{color:var(--brick);}
  .days-unit{font-size:10.5px;color:var(--ink-faint);}
  .days-num.never{font-size:13px;color:var(--brick);}

  .panel{max-height:0;overflow:hidden;transition:max-height .25s ease;border-top:1px solid transparent;}
  .card.open .panel{max-height:520px;border-top:1px solid var(--line);}
  .panel-inner{padding:14px;background:#FBFBF9;}

  .field-label{font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;}
  .field-row{display:flex;gap:8px;}
  .field-row > div{flex:1;}
  select, input[type=date]{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;
    font-family:inherit;font-size:14.5px;color:var(--ink);margin-bottom:10px;
  }
  .btn{width:100%;padding:12px;border:none;border-radius:8px;background:var(--sage);color:#fff;
    font-family:inherit;font-size:14.5px;font-weight:600;letter-spacing:.02em;cursor:pointer;}
  .btn:disabled{background:#C8CFC5;cursor:not-allowed;}
  .btn:active:not(:disabled){background:var(--sage-deep);}

  .history{margin-top:14px;}
  .history-title{font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;}
  .hist-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-soft);padding:6px 0;border-top:1px solid var(--line);}
  .hist-row:first-child{border-top:none;}
  .hist-del{background:none;border:none;color:var(--brick);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0;}

  .loading, .err, .empty{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px;}
  .err{color:var(--brick);}
  footer{padding:22px 20px 0;font-size:11px;color:var(--ink-faint);line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">りらくる入間宮寺店</p>
      <h1>備品 清掃・洗濯 管理板</h1>
      <p class="sub" id="todayLine"></p>
    </div>
    <button class="gear-btn" id="gearBtn" aria-label="目安日数の設定" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M17.6 6.4l-1.5 1.5M7.9 16.1l-1.5 1.5M17.6 17.6l-1.5-1.5M7.9 7.9L6.4 6.4"/></svg>
    </button>
  </header>

  <div class="settings-panel" id="settingsPanel">
    <p class="settings-title">目安日数の設定</p>
    <p class="settings-desc">カテゴリごとに「そろそろ」「要対応」になる経過日数を設定できます。全員に共有されます。</p>
    <div id="settingsRows"></div>
    <div class="settings-actions">
      <button class="btn btn-ghost" id="settingsCancel" type="button">閉じる</button>
      <button class="btn" id="settingsSave" type="button">保存する</button>
    </div>
    <p class="settings-msg" id="settingsMsg" style="display:none;"></p>
  </div>

  <div class="overview" id="overview"></div>
  <div class="tabbar" id="tabbar"></div>
  <div class="summary" id="summary"></div>
  <div id="listRoot"><div class="loading">読み込み中…</div></div>

  <footer>
    誰が・いつ行ったかを記録すると全員に共有されます。日付は今日以外（後日まとめて記録する場合など）も選べます。目安日数は右上の歯車アイコンから調整できます。
  </footer>
</div>

<script>
// ここに、Google Apps Script をウェブアプリとしてデプロイしたときに発行される URL を、ダブルクォーテーションの中に貼り付けてください。
// 例: const GAS_URL = "https://script.google.com/macros/s/XXXXXXXXXXXXXXXX/exec";
const GAS_URL = "https://script.google.com/macros/s/AKfycbwCNWCQl5-sOK-hgx0VOLsFWOS0FGyyrIfdevOsXap0Nu_ZK6-LGVHnlsO8XxK5RLel/exec";

const THERAPISTS = [
  "金丸","重田 将希","アリガ","もりや","シダ","荒井 剛","杏（あんず）","秋元",
  "久保","ぐっちー","ソノベ","サトウ","石田 周平","平野 陽子","粟野 幸子","ヤマギワ","川田"
];

const ITEMS = [
  {id:"fan_in_1", cat:"家庭用扇風機", name:"家庭用扇風機 ①"},
  {id:"fan_in_2", cat:"家庭用扇風機", name:"家庭用扇風機 ②"},
  {id:"fan_in_3", cat:"家庭用扇風機", name:"家庭用扇風機 ③"},
  {id:"fan_in_4", cat:"家庭用扇風機", name:"家庭用扇風機 ④"},
  {id:"fan_in_5", cat:"家庭用扇風機", name:"家庭用扇風機 ⑤"},

  {id:"pillow_cover", cat:"枕", name:"枕カバー 交換"},
  {id:"pillow_sun",   cat:"枕", name:"枕 天日干し"},

  {id:"sheet_1", cat:"ベッドシーツ", name:"シーツA2 洗濯"},
  {id:"sheet_2", cat:"ベッドシーツ", name:"シーツA4 洗濯"},
  {id:"sheet_3", cat:"ベッドシーツ", name:"シーツFree 洗濯"},

  {id:"circ_1", cat:"サーキュレーター", name:"サーキュレーター ①"},
  {id:"circ_2", cat:"サーキュレーター", name:"サーキュレーター ②"},

  {id:"garage_1", cat:"業務用大型扇風機", name:"業務用大型扇風機 ①"},
  {id:"garage_2", cat:"業務用大型扇風機", name:"業務用大型扇風機 ②"},
  {id:"garage_3", cat:"業務用大型扇風機", name:"業務用大型扇風機 ③"},

  {id:"ac_1", cat:"天井備え付けエアコン", name:"エアコンフィルター ①"},
  {id:"ac_2", cat:"天井備え付けエアコン", name:"エアコンフィルター ②"},
  {id:"ac_3", cat:"天井備え付けエアコン", name:"エアコンフィルター ③"},
  {id:"ac_4", cat:"天井備え付けエアコン", name:"エアコンフィルター ④"},

  {id:"toilet_fan", cat:"トイレ換気扇", name:"トイレ換気扇 清掃"},
];

const SHORT_LABELS = {
  fan_in_1:"扇①", fan_in_2:"扇②", fan_in_3:"扇③", fan_in_4:"扇④", fan_in_5:"扇⑤",
  pillow_cover:"枕カバー", pillow_sun:"枕干し", pillow_wash:"枕本体",
  sheet_1:"A2", sheet_2:"A4", sheet_3:"Free",
  circ_1:"サ①", circ_2:"サ②",
  garage_1:"大①", garage_2:"大②", garage_3:"大③",
  ac_1:"エ①", ac_2:"エ②", ac_3:"エ③", ac_4:"エ④",
  toilet_fan:"換気扇"
};

const ICONS = {
  "家庭用扇風機": '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="24" cy="20" r="13"/><path d="M24 20 L24 9 M24 20 L33 26 M24 20 L15 26" stroke-linecap="round"/><circle cx="24" cy="20" r="2.4" fill="currentColor" stroke="none"/><line x1="24" y1="33" x2="24" y2="41"/><line x1="15" y1="41" x2="33" y2="41" stroke-linecap="round"/></svg>',
  "枕": '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 20 C8 13 13 12 24 12 C35 12 40 13 40 20 C40 27 35 28 24 28 C13 28 8 27 8 20 Z"/><path d="M17 14 C15 17 15 23 17 26 M31 14 C33 17 33 23 31 26" stroke-width="1.3"/></svg>',
  "ベッドシーツ": '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 24 Q14 18 20 24 Q26 30 32 24 Q38 18 40 22" stroke-linecap="round"/><rect x="8" y="24" width="32" height="7" rx="1.5"/><line x1="10" y1="31" x2="10" y2="37"/><line x1="38" y1="31" x2="38" y2="37"/></svg>',
  "サーキュレーター": '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="14" y="7" width="20" height="26" rx="10"/><line x1="18" y1="14" x2="30" y2="14" stroke-width="1.2"/><line x1="18" y1="19" x2="30" y2="19" stroke-width="1.2"/><line x1="18" y1="24" x2="30" y2="24" stroke-width="1.2"/><circle cx="24" cy="14" r="1.6" fill="currentColor" stroke="none"/><line x1="24" y1="33" x2="24" y2="41"/><line x1="16" y1="41" x2="32" y2="41" stroke-linecap="round"/></svg>',
  "業務用大型扇風機": '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="24" cy="19" r="15"/><path d="M24 19 L24 6 M24 19 L35.5 26.5 M24 19 L12.5 26.5 M24 19 L35.5 11.5 M24 19 L12.5 11.5" stroke-width="1.1"/><circle cx="24" cy="19" r="2.6" fill="currentColor" stroke="none"/><line x1="12" y1="42" x2="24" y2="34" stroke-linecap="round"/><line x1="36" y1="42" x2="24" y2="34" stroke-linecap="round"/><line x1="24" y1="34" x2="24" y2="42" stroke-linecap="round"/></svg>',
  "天井備え付けエアコン": '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="6" y1="10" x2="42" y2="10"/><rect x="10" y="10" width="28" height="12" rx="2"/><path d="M14 26 L11 32 M20 26 L18 33 M28 26 L30 33 M34 26 L37 32" stroke-width="1.4" stroke-linecap="round"/></svg>',
  "トイレ換気扇": '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="12" y="10" width="24" height="24" rx="3"/><line x1="12" y1="16" x2="36" y2="16" stroke-width="1.2"/><line x1="12" y1="21" x2="36" y2="21" stroke-width="1.2"/><line x1="12" y1="26" x2="36" y2="26" stroke-width="1.2"/><line x1="12" y1="31" x2="36" y2="31" stroke-width="1.2"/></svg>',
};

const CATS = [
  {key:"家庭用扇風機",       accent:"#3E6E86", pale:"#E4EBEF", soonDefault:10, overdueDefault:14},
  {key:"枕",                 accent:"#8A6B2E", pale:"#F3ECDA", soonDefault:10, overdueDefault:14},
  {key:"ベッドシーツ",       accent:"#7A4F6E", pale:"#F1E6EE", soonDefault:2,  overdueDefault:3},
  {key:"サーキュレーター",   accent:"#4F6E45", pale:"#E6ECE2", soonDefault:10, overdueDefault:14},
  {key:"業務用大型扇風機",   accent:"#9C5A3D", pale:"#F2E2DA", soonDefault:10, overdueDefault:14},
  {key:"天井備え付けエアコン", accent:"#2E7A78", pale:"#DFEEED", soonDefault:20, overdueDefault:30},
  {key:"トイレ換気扇",       accent:"#5B5F7A", pale:"#E4E5EC", soonDefault:20, overdueDefault:30},
];

let state = {};        // { itemId: [ {recordId, date, person}, ... newest first ] }
let TARGETS = {};      // { catKey: {soonDays, overdueDays} }
let openId = null;
let activeCat = CATS[0].key;
let loadError = null;

CATS.forEach(c => { TARGETS[c.key] = {soonDays:c.soonDefault, overdueDays:c.overdueDefault}; });

const $ = (sel) => document.querySelector(sel);
const listRoot = $("#listRoot");
const summaryRoot = $("#summary");
const tabbarRoot = $("#tabbar");

function todayISO(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtDate(iso){
  const [y,m,d] = iso.split("-");
  return `${m}/${d}`;
}
function daysBetween(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const then = new Date(y, m-1, d);
  const now = new Date();
  const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((nowMid - then) / 86400000);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function getLast(item){
  const list = state[item.id];
  return (list && list.length) ? list[0] : null;
}
function severity(item){
  const last = getLast(item);
  const t = TARGETS[item.cat] || {soonDays:10, overdueDays:14};
  if(!last) return {level:"overdue", days:null};
  const days = daysBetween(last.date);
  if(days >= t.overdueDays) return {level:"overdue", days};
  if(days >= t.soonDays) return {level:"soon", days};
  return {level:"ok", days};
}

function renderTabs(){
  tabbarRoot.innerHTML = CATS.map(c => {
    const active = c.key === activeCat;
    const style = active ? `background:${c.accent};` : "";
    const dotStyle = `background:${active ? "#fff" : c.accent};`;
    return `<div class="tab ${active ? "active" : ""}" data-cat="${escapeHtml(c.key)}" style="${style}">
      <span class="tdot" style="${dotStyle}"></span>${escapeHtml(c.key)}
    </div>`;
  }).join("");
  tabbarRoot.querySelectorAll(".tab").forEach(el => {
    el.addEventListener("click", () => { activeCat = el.dataset.cat; openId = null; render(); });
  });
}

function renderOverview(){
  const rows = ITEMS.map(item => ({item, sev: severity(item)}));
  const order = {overdue:0, soon:1, ok:2};
  rows.sort((a,b) => {
    if(order[a.sev.level] !== order[b.sev.level]) return order[a.sev.level]-order[b.sev.level];
    const da = a.sev.days === null ? 9999 : a.sev.days;
    const db = b.sev.days === null ? 9999 : b.sev.days;
    return db - da;
  });
  const tiles = rows.map(r => {
    const label = SHORT_LABELS[r.item.id] || r.item.name;
    const daysHTML = r.sev.days === null ? `<div class="ov-days never">未</div>` : `<div class="ov-days">${r.sev.days}</div>`;
    return `<div class="ov-tile state-${r.sev.level}" data-cat="${escapeHtml(r.item.cat)}" title="${escapeHtml(r.item.name)}">
      <div class="ov-icon">${ICONS[r.item.cat] || ""}</div>
      <div class="ov-label">${escapeHtml(label)}</div>
      ${daysHTML}
    </div>`;
  }).join("");
  document.getElementById("overview").innerHTML = `
    <div class="overview-title">全体マップ（タップでタブ移動）</div>
    <div class="ov-grid">${tiles}</div>
  `;
  document.querySelectorAll(".ov-tile").forEach(el => {
    el.addEventListener("click", () => {
      activeCat = el.dataset.cat;
      openId = null;
      render();
      tabbarRoot.scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
}

function renderSummary(rows){
  const counts = {overdue:0, soon:0, ok:0};
  rows.forEach(r => counts[r.sev.level]++);
  summaryRoot.innerHTML = `
    <div class="sum-item overdue"><div class="sum-num">${counts.overdue}</div><div class="sum-label">要対応</div></div>
    <div class="sum-item soon"><div class="sum-num">${counts.soon}</div><div class="sum-label">そろそろ</div></div>
    <div class="sum-item ok"><div class="sum-num">${counts.ok}</div><div class="sum-label">問題なし</div></div>
  `;
}

function render(){
  renderTabs();

  if(loadError){
    listRoot.innerHTML = `<div class="err">読み込みに失敗しました。${escapeHtml(loadError)}</div>`;
    summaryRoot.innerHTML = "";
    document.getElementById("overview").innerHTML = "";
    return;
  }

  renderOverview();

  const catItems = ITEMS.filter(i => i.cat === activeCat);
  const rows = catItems.map(item => ({item, sev: severity(item)}));
  renderSummary(rows);

  const order = {overdue:0, soon:1, ok:2};
  rows.sort((a,b) => {
    if(order[a.sev.level] !== order[b.sev.level]) return order[a.sev.level]-order[b.sev.level];
    const da = a.sev.days === null ? 9999 : a.sev.days;
    const db = b.sev.days === null ? 9999 : b.sev.days;
    return db - da;
  });

  listRoot.innerHTML = `<div class="list">${rows.map(r => cardHTML(r.item, r.sev)).join("")}</div>`;

  rows.forEach(r => {
    const card = document.getElementById("card-"+r.item.id);
    card.querySelector(".row").addEventListener("click", () => toggleCard(r.item.id));
    const btn = card.querySelector(".record-btn");
    const sel = card.querySelector(".person-select");
    const dateInput = card.querySelector(".date-input");
    const updateBtn = () => { btn.disabled = !(sel.value && dateInput.value); };
    if(sel) sel.addEventListener("change", updateBtn);
    if(dateInput) dateInput.addEventListener("change", updateBtn);
    if(btn) btn.addEventListener("click", (e) => { e.stopPropagation(); recordAction(r.item.id, dateInput.value, sel.value); });
    card.querySelectorAll(".hist-del").forEach(delBtn => {
      delBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        deleteRecord(r.item.id, delBtn.dataset.recordId);
      });
    });
  });
}

function cardHTML(item, sev){
  const last = getLast(item);
  const isOpen = openId === item.id;
  const daysLabel = sev.days === null
    ? `<div class="days-num never">未記録</div>`
    : `<div class="days-num">${sev.days}</div><div class="days-unit">日経過</div>`;
  const lastInfo = last ? `前回 ${fmtDate(last.date)}・${escapeHtml(last.person)}` : "まだ記録がありません";

  const history = (state[item.id] || []).slice(0,5);
  const histHTML = history.length
    ? `<div class="history">
         <div class="history-title">履歴</div>
         ${history.map(h => `<div class="hist-row"><span>${fmtDate(h.date)}・${escapeHtml(h.person)}</span><button class="hist-del" data-record-id="${escapeHtml(h.recordId)}">取消</button></div>`).join("")}
       </div>`
    : "";

  const options = `<option value="">担当者を選択</option>` + THERAPISTS.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");

  return `
    <div class="card state-${sev.level} ${isOpen ? "open" : ""}" id="card-${item.id}">
      <div class="row">
        <div class="icon-badge">${ICONS[item.cat] || ""}</div>
        <div class="row-main">
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="last-info">${lastInfo}</div>
        </div>
        <div class="days-box">${daysLabel}</div>
      </div>
      <div class="panel">
        <div class="panel-inner">
          <div class="field-row">
            <div>
              <div class="field-label">実施した人</div>
              <select class="person-select">${options}</select>
            </div>
            <div>
              <div class="field-label">実施日</div>
              <input type="date" class="date-input" value="${todayISO()}" max="${todayISO()}">
            </div>
          </div>
          <button class="btn record-btn" disabled>この内容で記録する</button>
          ${histHTML}
        </div>
      </div>
    </div>
  `;
}

function toggleCard(id){
  openId = (openId === id) ? null : id;
  render();
}

async function apiGet(){
  const res = await fetch(GAS_URL + "?action=list");
  if(!res.ok) throw new Error("サーバーエラー ("+res.status+")");
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || "不明なエラー");
  return data.records;
}

async function apiGetTargets(){
  const res = await fetch(GAS_URL + "?action=targets");
  if(!res.ok) throw new Error("サーバーエラー ("+res.status+")");
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || "不明なエラー");
  return data.targets || [];
}

async function apiAdd(record){
  const res = await fetch(GAS_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify({action:"add", ...record})
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || "保存に失敗しました");
}

async function apiDelete(recordId){
  const res = await fetch(GAS_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify({action:"delete", recordId})
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || "削除に失敗しました");
}

async function apiSaveTargets(targets){
  const res = await fetch(GAS_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify({action:"saveTargets", targets})
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || "保存に失敗しました");
}

function rebuildStateFromRecords(records){
  state = {};
  records.forEach(r => {
    if(!state[r.itemId]) state[r.itemId] = [];
    state[r.itemId].push({recordId: r.recordId, date: r.date, person: r.person, recordedAt: r.recordedAt});
  });
  Object.values(state).forEach(list => {
    list.sort((a,b) => (b.date + b.recordedAt).localeCompare(a.date + a.recordedAt));
  });
}

function applyTargets(targetRows){
  targetRows.forEach(t => {
    if(TARGETS[t.category]){
      const soon = Number(t.soonDays);
      const overdue = Number(t.overdueDays);
      if(!isNaN(soon)) TARGETS[t.category].soonDays = soon;
      if(!isNaN(overdue)) TARGETS[t.category].overdueDays = overdue;
    }
  });
}

async function loadAll(){
  const [records, targetRows] = await Promise.all([apiGet(), apiGetTargets()]);
  rebuildStateFromRecords(records);
  applyTargets(targetRows);
}

async function recordAction(itemId, date, person){
  if(!date || !person) return;
  const recordId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
  if(!state[itemId]) state[itemId] = [];
  state[itemId].unshift({recordId, date, person, recordedAt: new Date().toISOString()});
  state[itemId].sort((a,b) => (b.date + b.recordedAt).localeCompare(a.date + a.recordedAt));
  render();
  try{
    await apiAdd({recordId, itemId, date, person});
  }catch(e){
    alert("保存に失敗しました。通信状況を確認してもう一度お試しください。");
    await refresh();
  }
}

async function deleteRecord(itemId, recordId){
  if(!confirm("この記録を取り消します。よろしいですか？")) return;
  const list = state[itemId] || [];
  const idx = list.findIndex(r => r.recordId === recordId);
  if(idx >= 0) list.splice(idx,1);
  render();
  try{
    await apiDelete(recordId);
  }catch(e){
    alert("削除に失敗しました。通信状況を確認してもう一度お試しください。");
    await refresh();
  }
}

async function refresh(){
  try{
    loadError = null;
    await loadAll();
  }catch(e){
    loadError = String(e.message || e);
  }
  render();
}

function renderSettingsRows(){
  const rowsHTML = CATS.map(c => {
    const t = TARGETS[c.key];
    return `<div class="settings-row">
      <div class="settings-cat"><span class="icon-mini">${ICONS[c.key] || ""}</span>${escapeHtml(c.key)}</div>
      <div class="settings-fields">
        <div class="settings-field">
          <label>そろそろ</label>
          <input type="number" min="1" step="1" class="soon-input" data-cat="${escapeHtml(c.key)}" value="${t.soonDays}">
        </div>
        <div class="settings-field">
          <label>要対応</label>
          <input type="number" min="1" step="1" class="overdue-input" data-cat="${escapeHtml(c.key)}" value="${t.overdueDays}">
        </div>
      </div>
    </div>`;
  }).join("");
  document.getElementById("settingsRows").innerHTML = rowsHTML;
}

function openSettings(){
  renderSettingsRows();
  document.getElementById("settingsMsg").style.display = "none";
  document.getElementById("settingsPanel").classList.add("open");
}
function closeSettings(){
  document.getElementById("settingsPanel").classList.remove("open");
}

async function saveSettings(){
  const msg = document.getElementById("settingsMsg");
  const newTargets = CATS.map(c => {
    const soonEl = document.querySelector(`.soon-input[data-cat="${CSS.escape(c.key)}"]`);
    const overdueEl = document.querySelector(`.overdue-input[data-cat="${CSS.escape(c.key)}"]`);
    return {
      category: c.key,
      soonDays: Number(soonEl.value),
      overdueDays: Number(overdueEl.value)
    };
  });
  for(const t of newTargets){
    if(!t.soonDays || !t.overdueDays || t.soonDays <= 0 || t.overdueDays <= 0){
      msg.textContent = "1以上の数字を入力してください。";
      msg.className = "settings-msg err";
      msg.style.display = "block";
      return;
    }
    if(t.soonDays > t.overdueDays){
      msg.textContent = `「${t.category}」は、そろそろ日数が要対応日数より小さくなるように設定してください。`;
      msg.className = "settings-msg err";
      msg.style.display = "block";
      return;
    }
  }
  msg.textContent = "保存中…";
  msg.className = "settings-msg";
  msg.style.display = "block";
  try{
    await apiSaveTargets(newTargets);
    applyTargets(newTargets);
    render();
    msg.textContent = "保存しました。";
    setTimeout(() => { closeSettings(); }, 700);
  }catch(e){
    msg.textContent = "保存に失敗しました。通信状況を確認してもう一度お試しください。";
    msg.className = "settings-msg err";
  }
}

document.getElementById("gearBtn").addEventListener("click", openSettings);
document.getElementById("settingsCancel").addEventListener("click", closeSettings);
document.getElementById("settingsSave").addEventListener("click", saveSettings);

async function init(){
  $("#todayLine").textContent = new Date().toLocaleDateString("ja-JP", {year:"numeric", month:"long", day:"numeric", weekday:"short"});
  if(!GAS_URL){
    loadError = "GAS_URL が設定されていません。コード内の GAS_URL に、デプロイした Google Apps Script のURLを貼り付けてください。";
    render();
    return;
  }
  listRoot.innerHTML = `<div class="loading">読み込み中…</div>`;
  await refresh();
}

init();
</script>
</body>
</html>
